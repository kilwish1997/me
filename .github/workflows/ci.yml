name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} on ubuntu-latest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run unit and boundary tests
        run: npm test

      - name: Build packages and demo application
        run: npm run build

      - name: Package local tarballs
        run: npm run pack:all

      - name: Verify consumer installation and Node execution
        run: |
          npm run --workspace plotwise-consumer-example test:node
          chmod +x examples/consumer/test-packed-install.sh
          ./examples/consumer/test-packed-install.sh
